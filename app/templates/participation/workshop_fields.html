{% for workshop in workshops if workshop.status=='active' %}<label class="choice"><input type="checkbox" name="workshop_ids" value="{{ workshop.id }}" {% if workshop.id in chosen|default([]) %}checked{% endif %}><span><strong>{{ workshop.name }}</strong> · {{ workshop.location }}<small>{{ workshop.starts_at|paris_date }} — {{ workshop.ends_at|paris_date }} · {{ 'Capacité illimitée' if workshop.capacity is none else workshop.capacity ~ ' place(s) au total' }}{% if places is defined and workshop.capacity is not none %} · {{ places.get(workshop.id,0) }} place(s) restante(s){% endif %}</small><small class="preserve-lines">{{ workshop.description }}</small></span></label>{% else %}<p>Aucun atelier actif. La participation à l’événement peut être confirmée sans atelier.</p>{% endfor %}
